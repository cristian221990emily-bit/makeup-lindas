<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makeup Lind@s</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:Arial,sans-serif}
.top{background:#000;padding:22px;text-align:center;border-bottom:3px solid #D4AF37}
.top h1{color:#D4AF37;font-size:26px;letter-spacing:2px}
.top p{color:#aaa;font-size:11px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:900px;margin:auto}
.card{background:#111;border:1px solid #222;border-radius:22px;overflow:hidden}
.card img{width:100%;height:250px;object-fit:cover}
.info{padding:12px;text-align:center}
.info h3{color:#D4AF37;font-size:12px;font-weight:900}
.info small{color:#777;font-size:9px;display:block;margin:5px 0 10px}
.btn{display:block;background:#D4AF37;color:#000;padding:11px;border-radius:25px;font-weight:900;font-size:11px;text-decoration:none}
</style>
</head>
<body>
<div class="top"><h1>MAKEUP LIND@S</h1><p>PURPURE ORIGINAL - CALI</p></div>
<div class="grid" id="g"></div>
<script>
const N={"WA0738":"WATERMELON","WA1641":"PIÑA COLADA","WA2306":"PIÑA COLADA SPLASH","WA4926":"BUBBLE GUM","WA4936":"FRESA LUXE","WA5103":"ALGODON DE AZUCAR","WA5361":"VAINILLA COCO"};
fetch('https://api.github.com/repos/cristian221990emily-bit/makeup-lindas/contents').then(r=>r.json()).then(f=>{
let imgs=f.filter(x=>x.name.match(/\.jpg|\.png/i));
let g=document.getElementById('g');g.innerHTML='';
imgs.forEach(x=>{
let k=Object.keys(N).find(c=>x.name.includes(c));
let n=k?N[k]:x.name;
g.innerHTML+=`<div class=card><img src="${x.name}"><div class=info><h3>${n}</h3><small>Purpure 250g Original</small><a class=btn href="https://wa.me/573161465193?text=Hola%20quiero%20${n}">WHATSAPP</a></div></div>`
})})
</script>
</body>
</html>
