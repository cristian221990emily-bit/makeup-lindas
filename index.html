<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEUP LIND@S</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px;padding-bottom:220px}
.logo{width:250px;margin:15px auto;display:block;border-radius:12px}
#productos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.prod{background:#111;border-radius:18px;padding:6px;border:1px solid #222}
.prod img{width:100%;border-radius:14px;aspect-ratio:1/1;object-fit:cover;display:block}
.boton{display:block;background:#FFD700;color:#000;padding:11px;border-radius:25px;text-decoration:none;font-weight:bold;margin-top:7px;font-size:11px}
.flot{position:fixed;bottom:20px;left:15px;display:flex;gap:14px;z-index:9998}
.flot a{width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.flot a img{width:100%;height:100%;object-fit:cover}
#visor{position:fixed;inset:0;background:rgba(0,0,0,0.96);display:none;z-index:99999;align-items:center;justify-content:center}
#visor img{max-width:96%;max-height:90%;border-radius:14px}
</style>
</head>
<body>
<img id="miLogo" class="logo">
<div id="productos"></div>
<div class="flot">
<a href="https://www.instagram.com/makeuplinda2026" target="_blank"><img src="./instagram.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2111/2111463.png'"></a>
<a href="https://wa.me/573161465193" target="_blank"><img src="./whatsapp.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/733/733585.png'"></a>
</div>
<div id="visor" onclick="this.style.display='none'"><img id="fotoGrande"></div>
<script>
function abrir(f){document.getElementById('fotoGrande').src=f;document.getElementById('visor').style.display='flex';}
fetch('https://api.github.com/repos/cristian221990emily-bit/makeup-lindas/contents/?'+Date.now()).then(r=>r.json()).then(d=>{
let logo=d.find(f=>f.name.includes('8325'));if(logo)document.getElementById('miLogo').src=logo.download_url;
let fotos=d.filter(f=>{let n=f.name.toLowerCase();return (n.endsWith('.jpg')||n.endsWith('.jpeg')||n.endsWith('.png'))&&!n.includes('8325')&&n!=='instagram.png'&&n!=='whatsapp.png';});
let h='';for(let i=0;i<fotos.length;i++){h+=`<div class="prod"><img src="${fotos[i].download_url}" onclick="abrir('${fotos[i].download_url}')"><a class="boton" href="https://wa.me/573161465193?text=Hola%20quiero%20producto%20${i+1}" target="_blank">PEDIR POR WHATSAPP</a></div>`;}
document.getElementById('productos').innerHTML=h;
});
</script>
</body>
</html>
