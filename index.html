</style>

<body>
<img id="miLogo" class="logo">
<h3 style="color:#FFD700">✏️ Escribe el nombre real debajo de cada foto</h3>
<div id="productos"></div>

<div id="resultado" style="display:none">
<h3 style="color:#25D366">¡Copia este código y pégalo en GitHub de nuevo!</h3>
<textarea id="codigoFinal"></textarea>
</div>

let fotosGlobal=[];
async function cargar(){
 let r=await fetch('https://api.github.com/repos/cristian221990emily-bit/makeup-lindas/contents/');
 let d=await r.json();
 let logo=d.find(f=>f.name.toLowerCase().includes('logo')||f.name.includes('8325'));
 if(logo)document.getElementById('miLogo').src=logo.download_url;
 fotosGlobal=d.filter(f=>{let n=f.name.toLowerCase();return (n.endsWith('.jpg')||n.endsWith('.png')||n.endsWith('.jpeg'))&&!n.includes('logo')&&!f.name.includes('8325');});
 let c=document.getElementById('productos');c.innerHTML='';
 fotosGlobal.forEach((a,i)=>{
   let div=document.createElement('div');div.className='prod';
   let img=document.createElement('img');img.src=a.download_url;
   let inp=document.createElement('input');inp.id='input-'+i;inp.placeholder='Ej: Shampoo Banano, Candy Bum, etc.';
   let g=JSON.parse(localStorage.getItem('nombresFix')||'{}');if(g[a.name])inp.value=g[a.name];

   let small=document.createElement('div');small.style.fontSize='10px';small.style.color='#666';small.innerText=a.name;
   div.appendChild(img);div.appendChild(small);div.appendChild(inp);c.appendChild(div);
 });
}
