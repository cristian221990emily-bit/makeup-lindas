<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEUP LIND@S</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px;padding-bottom:90px}
.logo{width:220px;margin:10px auto;display:block;border-radius:15px}
#productos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.prod{background:#111;border-radius:15px;padding:8px;border:1px solid #222}
.prod img{width:100%;border-radius:12px;aspect-ratio:1/1;object-fit:cover}
.nombre{color:#FFD700;font-weight:bold;font-size:13px;margin:8px 0 4px 0;min-height:36px}
.btn{display:block;background:#FFD700;color:#000;padding:10px;border-radius:20px;text-decoration:none;font-weight:bold;margin-top:6px;font-size:12px}
#visor{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;justify-content:center;align-items:center;z-index:999}
#visor img{max-width:95%;max-height:90%;border-radius:15px}
.wa-flotante{position:fixed;bottom:20px;right:20px;background:#25D366;width:65px;height:65px;border-radius:50%;display:flex;justify-content:center;align-items:center;z-index:1000}
.wa-flotante img{width:38px;height:38px}
</style>
</head>
<body>
<img id="miLogo" class="logo" alt="MAKEUP LIND@S">
<h2 style="color:#FFD700;letter-spacing:2px">MAKEUP LIND@S</h2>
<div id="productos"></div>
<div id="visor" onclick="this.style.display='none'"><img id="imgGrande"></div>
<a href="https://wa.me/573161465193?text=Hola Jennifer! Vi tu tienda MAKEUP LIND@S" class="wa-flotante" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>
<script>
async function cargar(){
 try{
  let r=await fetch('https://api.github.com/repos/cristian221990emily-bit/makeup-lindas/contents/');
  let d=await r.json();
  let logoFile = d.find(f => f.name.toLowerCase().includes('logo') || f.name.includes('8325'));
  if(logoFile) document.getElementById('miLogo').src = logoFile.download_url;

  let fotos = d.filter(f => {
    let n=f.name.toLowerCase();
    return (n.endsWith('.jpg')||n.endsWith('.png')||n.endsWith('.jpeg')) &&!n.includes('logo') &&!f.name.includes('8325');
  });

  let nombres = ["Poción Kids Anyeluz","Kit Banano Anyeluz Nutritivo","Primer HudaBon Make Cream","Shampoo Cebolla Anyeluz"];

  let c=document.getElementById('productos');
  c.innerHTML='';
  fotos.forEach((a,i)=>{
    let div=document.createElement('div');div.className='prod';
    let img=document.createElement('img');img.src=a.download_url;
    img.onclick=()=>{document.getElementById('imgGrande').src=a.download_url;document.getElementById('visor').style.display='flex';}
    let nom=document.createElement('div');nom.className='nombre';nom.innerText=nombres[i] || "Producto Makeup Lind@s";
    let b=document.createElement('a');b.className='btn';b.href=`https://wa.me/573161465193?text=Hola Jennifer! Me interesa: ${nom.innerText}`;b.target='_blank';b.innerText='PEDIR POR WHATSAPP';
    div.appendChild(img);div.appendChild(nom);div.appendChild(b);c.appendChild(div);
  });
 }catch(e){console.log(e); document.getElementById('productos').innerHTML='<p style="color:white">Error cargando productos, recarga la página</p>';}
}
cargar();
</script>
</body>
</html>
