<head>

<title>MAKEUP LIND@S</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:0}
.marquesina{background:#ff6da9;color:#fff;padding:8px 0;overflow:hidden;white-space:nowrap;position:relative;font-weight:bold;font-size:13px;letter-spacing:1px}
.marquesina div{display:inline-block;animation:mover 18s linear infinite;padding-left:100%}
@keyframes mover{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.contenido{padding:10px 10px 0 10px}
.logo{width:250px;max-width:90%;margin:15px auto;display:block;border-radius:12px}
#productos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;padding-bottom:85px}
.prod{background:#111;border-radius:18px;padding:6px;border:1px solid #222;overflow:hidden;width:100%;box-sizing:border-box}
.prod img{width:100%;height:190px;object-fit:cover;border-radius:14px 14px 0 0;display:block;background:#222}
.boton{display:block;background:#FFD700;color:#000;padding:11px;border-radius:25px;text-decoration:none;font-weight:bold;margin-top:7px;font-size:11px}
.prod:last-child:nth-child(odd){grid-column:1 / -1;max-width:calc(50% - 6px);margin:0 auto}
.flot{position:fixed;bottom:15px;left:15px;display:flex;gap:14px;z-index:9998}
.flot a{width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
.flot a img{width:100%;height:100%;object-fit:cover}
#visor{position:fixed;inset:0;background:rgba(0,0,0,0.96);display:none;z-index:99999;align-items:center;justify-content:center}
#visor img{max-width:96%;max-height:90%;border-radius:14px}
</style>
</head>
